                  home: `# 🌌 OpenCode User Guide

      Welcome to the **OpenCode** ecosystem. This guide will help you navigate the powerful agentic framework, leverage built-in skills, and automate your development workflow.

      ---

      ## 🧭 Navigation

      | Section | Description |
      | :--- | :--- |
      | [**🤖 Agents Guide**](Agents-Guide.md) | Meet your AI team and learn how to orchestrate them. |
      | [**⚡ Workflows Guide**](Workflows-Guide.md) | Automate complex tasks with multi-agent workflows. |
      | [**🔌 Plugins Guide**](Plugins-Guide.md) | Extend OpenCode with community and built-in plugins. |

      | [**📚 OpenCode Skills Catalog**](OpenCode-Skills-Catalog.md) | A complete directory of 40+ specialized OpenCode skills. |

      ---

      ## 🚀 Getting Started

      OpenCode is designed to be your autonomous coding partner. Unlike simple chat interfaces, OpenCode uses a **Swarm Architecture** where specialized agents collaborate to solve problems.

      ### Core Philosophy
      1. **Plan Before Action**: Always use the 'plan' agent or 'project-planner' before major changes.
      2. **Specialization Wins**: Use the right agent for the right task (e.g., 'laravel-expert' for PHP, 'ui' for CSS).
      3. **Continuous Improvement**: The system learns from your codebase and its own mistakes via the 'self-improver'.

      ### The Magic Command
      The primary entry point for complex tasks is often a workflow:
      \`\`\`bash
      /workflow run feature-development
      \`\`\`
      This triggers a multi-phase process: **Plan ➔ Implement ➔ Review ➔ Test**.

      ---

      ## 🛠️ Essential Tools

      OpenCode integrates several high-performance tools:
      - **MCP Servers**: Standardized access to Filesystem, SQLite, Git, and Browser.
      - **LSP Integration**: Real-time code analysis and type checking.
      - **Auto-Formatters**: Built-in support for Biome and Prettier.

      ---

      ## 💡 Quick Tips
      - **@[docs]**: Mention this to give agents access to the documentation directory.
      - **Self-Improvement**: Run \`node self-improver.js\` periodically to keep the system sharp.
      - **Context Management**: Use the \`opencode-dcp\` plugin to keep your token usage efficient.

      ---

      > [!TIP]
      > Need help with a specific stack? Check out the [**Skills Guide**](Skills-Guide.md) to see how OpenCode auto-detects your project type.`,
                  agents: `# 🤖 Agents Guide

      OpenCode features a diverse team of **18+ specialized agents**. Each agent is optimized for specific phases of the software development lifecycle.

      ---

      ## 👥 The Core Team

      | Agent | Primary Role | When to Use |
      | :--- | :--- | :--- |
      | **\`project-orchestrator\`** | Team Lead | Managing complex, multi-file changes and high-level logic. |
      | **\`build\`** | Implementer | Fast, minimal edits and direct implementation. |
      | **\`plan\`** | Architect | Read-only analysis and strategy without making changes. |
      | **\`code-reviewer\`** | Quality Guard | Analyzing code for performance, security, and standards. |
      | **\`laravel-expert\`** | PHP Specialist | Deep knowledge of Laravel 13, Livewire 4, and PHP 8.3. |
      | **\`tauri-expert\`** | Rust Specialist | Building cross-platform desktop apps with Rust/Tauri. |
      | **\`ui\`** | Designer | Crafting premium CSS, animations, and responsive layouts. |
      | **\`self-improver\`** | System Admin | Analyzing the project and suggesting architectural upgrades. |

      ---

      ## 🎯 How to Orchestrate Agents

      ### Switching Agents
      You can switch the active agent at any time:
      \`\`\`bash
      /agent laravel-expert
      \`\`\`

      ### Best Practices for Prompting
      1. **Be Specific**: Instead of "Fix the bug," say "Use \`laravel-expert\` to fix the validation error in \`UserRequest.php\`."
      2. **Provide Context**: Mention relevant files or the \`@[docs]\` directory.
      3. **Use the "Plan First" Pattern**:
         - Ask \`plan\` to outline the changes.
         - Once satisfied, ask \`build\` to implement them.
         - Ask \`code-reviewer\` to verify.

      ---

      ## 📂 Custom Agent Definitions

      Agents are defined in two places:
      1. **\`opencode.json\`**: Global configuration and permissions.
      2. **\`agents/*.md\`**: Detailed system instructions for each agent.

      ### Example: Customizing an Agent
      To modify the \`ui\` agent, edit \`agents/ui.md\`. You can add specific design preferences or color palettes there to ensure consistency across your project.

      ---

      ## 🛠️ Specialized Agents Reference

      ### **Documentation & Governance**
      - **\`docs-governor\`**: Ensures documentation stays in sync with code.
      - **\`documentation-writer\`**: Automatically generates technical docs from source.

      ### **Testing & Security**
      - **\`testing-expert\`**: Generates comprehensive Vitest, Jest, or PHPUnit suites.

      ---

      > [!IMPORTANT]

                  workflows: `# ⚡ Workflows Guide

      Workflows are automated, multi-agent sequences designed to handle complex development tasks without manual intervention between steps.

      ---

      ## 🏃 Running a Workflow

      Use the \`/workflow\` command to manage and execute workflows:

      \`\`\`bash
      /workflow list            # See available workflows
      /workflow run bug-fix     # Start the bug fixing automation
      \`\`\`

      ---

      ## 🏗️ Core Workflows

      OpenCode comes with several pre-defined workflows in the \`workflows/\` directory:

      ### 1. \`feature-development\`
      **Phases**:
      - **Plan**: \`project-planner\` analyzes requirements and creates a task list.
      - **Implement**: \`build\` executes the changes step-by-step.
      - **Review**: \`code-reviewer\` checks for issues.
      - **Test**: \`testing-expert\` ensures everything works.

      ### 2. \`bug-fix\`
      **Phases**:
      - **Reproduce**: Attempts to create a failing test case.
      - **Fix**: \`debug\` agent identifies and resolves the root cause.
      - **Verify**: Runs tests to ensure the fix is successful and no regressions occur.

      ---

      ## 🛠️ How it Works: The Workflow Engine

      The \`workflow-engine.js\` at the project root is responsible for:
      - Parsing YAML workflow definitions.
      - Spawning agents with specific contexts.
      - Passing output from one agent as input to the next.
      - Handling errors and retries.

      ---

      ## ✍️ Creating Custom Workflows

      Workflows are defined in YAML. Create a new file in \`workflows/\` (e.g., \`workflows/deploy.yaml\`):

      \`\`\`yaml
      name: Deployment Preparation
      steps:
        - name: Audit
          agent: security
          task: "Check for any exposed credentials or vulnerable dependencies."
        - name: Build
          agent: build
          task: "Run npm run build and report any warnings."
        - name: Documentation
          agent: docs-governor
          task: "Update the changelog with recent changes."
      \`\`\`

      ---

      ## 💡 Pro Tips

      - **Checkpointing**: The engine saves the state after each step. If a workflow fails, you can often resume from the last successful step.
      - **Manual Intervention**: You can insert a "wait for user" step in your YAML if you want to approve a plan before implementation starts.
      - **Tool Access**: Workflows have full access to all configured MCP tools and skills.

      ---

      > [!NOTE]
      > Workflows are the best way to leverage the "Swarm" power of OpenCode. They turn a series of manual prompts into a single, reliable automation.`,
                  plugins: `# 🔌 Plugins Guide

      Plugins extend the core functionality of OpenCode, providing new commands, UI enhancements, and background capabilities.

      ---

      ## 🛠️ Managing Plugins

      Plugins are registered in \`opencode.json\` under the \`plugin\` array. Most plugins are installed via \`npm\` and then activated in the config.

      ---

      ## 🌟 Essential Plugins

      ### 1. **Dynamic Context Pruning (\`opencode-dcp\`)**
      - **Purpose**: Prevents "context bloat" by intelligently removing old tool outputs.
      - **Benefit**: Saves tokens and keeps the agent focused on the current task.

      ### 2. **Background Agents (\`opencode-background-agents\`)**
      - **Purpose**: Spawn async agents that work while you keep typing.
      - **Command**: \`/bg "Task description"\`

      ### 3. **CC Safety Net (\`cc-safety-net\`)**
      - **Purpose**: A security layer that intercepts dangerous commands like \`rm -rf /\` or \`git push --force\`.
      - **Status**: Always active by default in the recommended setup.

      ### 4. **Oh My OpenCode (\`oh-my-opencode\`)**
      - **Purpose**: Adds the \`ulw\` (Ultrawork) keyword for automatic task decomposition.
      - **Usage**: Just start a prompt with \`ulw\` to trigger the swarm.

      ---

      ## ⚙️ Configuration Example

      To enable and configure a plugin, add it to your \`opencode.json\`:

      \`\`\`json
      {
        "plugins": {
          "opencode-dcp": {
            "threshold": 0.8,
            "preserveRecent": 15
          }
        }
      }
      \`\`\`

      ---

      ## 🚀 Built-in Bridges

      OpenCode includes specialized "Bridges" to integrate with other tools:
      - **Trae Bridge**: Connects OpenCode directly to the Trae IDE's terminal and context.
      - **LSP Bridge**: Allows agents to "see" what your IDE sees (type errors, definitions).

      ---

      ## 📝 Creating Your Own Plugin

      OpenCode plugins are typically Node.js modules that export a standard interface. They can:
      - Add new \`/\` commands.
      - Intercept tool calls (pre/post hooks).
      - Modify the system prompt dynamically.

      Check \`plugins/index.ts\` for the entry point of custom local plugins.

      ---

      > [!CAUTION]
      > Always install plugins from trusted sources. Since plugins have access to your terminal and filesystem, they should be audited carefully.`,
                  skills: `# 🛠️ Skills Guide

      Skills are specialized capabilities that agents can "load" to handle specific technologies or complex workflows.

      ---

              function formatCallouts(html) {
                  return html
                      .replace(/> \[!TIP\]\n> (.*)/g, '<div class="callout callout-tip"><strong>💡 Tip:</strong> $1</div>')
                      .replace(/> \[!NOTE\]\n> (.*)/g, '<div class="callout callout-note"><strong>ℹ️ Note:</strong> $1</div>')
                      .replace(/> \[!IMPORTANT\]\n> (.*)/g, '<div class="callout callout-important"><strong>⚠️ Important:</strong> $1</div>')
                      .replace(/> \[!CAUTION\]\n> (.*)/g, '<div class="callout callout-caution"><strong>🛑 Caution:</strong> $1</div>');
              }

              function loadPage(pageKey) {
                  // Update active state
                  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                  const navItems = document.querySelectorAll('.nav-item');
                  const index = Array.from(navItems).findIndex(el => el.onclick.toString().includes(pageKey));
                  if (index !== -1) navItems[index].classList.add('active');

                  const contentDiv = document.getElementById('content');

                  // Animation reset
                  contentDiv.style.animation = 'none';
                  contentDiv.offsetHeight; // trigger reflow
                  contentDiv.style.animation = null;

                  // Check if page is hardcoded
                  if (pages[pageKey]) {
                      let md = pages[pageKey];
                      let html = marked.parse(md);
                      html = formatCallouts(html);
                      contentDiv.innerHTML = `<div class="markdown-body">${html}</div>`;
                      Prism.highlightAll();
                  } else {
                      // Load MD file dynamically
                      fetch(`${pageKey}.md`)
                          .then(response => response.text())
                          .then(md => {
                              let html = marked.parse(md);
                              html = formatCallouts(html);
                              contentDiv.innerHTML = `<div class="markdown-body">${html}</div>`;
                              Prism.highlightAll();
                          })
                          .catch(error => {
                              contentDiv.innerHTML = `<div class="markdown-body"><h1>Error</h1><p>Failed to load ${pageKey}.md: ${error.message}</p></div>`;
                          });
                  }
              }

              // Initialize with User-Guide
